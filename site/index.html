<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>PQC Watch · Actualité cyber post-quantique</title>
  <meta name="description" content="Veille sur la cryptographie post-quantique (PQC), la distribution quantique de clés (QKD) et la menace quantique pour la cybersécurité.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/brand/icone.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <a class="skip" href="#contenu">Aller au contenu</a>

  <header class="topbar">
    <div class="wrap bar">
      <div class="brand">
        <a class="brand-logo" href="https://hoplite-cyber.com" target="_blank" rel="noopener" aria-label="Hoplite Cybersécurité (ouvre le site hoplite-cyber.com)"><img class="logo-light" src="assets/brand/logo-horizontal.png" alt="Hoplite Cybersécurité" width="150" height="50"><img class="logo-dark" src="assets/brand/logo-horizontal-blanc.png" alt="Hoplite Cybersécurité" width="150" height="50"></a>
        <span class="div" aria-hidden="true"></span>
        <a class="brand-name" href="./" aria-label="PQC Watch, accueil">PQC Watch</a>
      </div>
      <button class="theme-toggle" id="theme" type="button" aria-pressed="false" aria-label="Mode sombre" title="Mode sombre">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <nav class="views" aria-label="Vues">
    <div class="wrap">
      <div class="vtabs" role="tablist">
        <button class="vtab" role="tab" data-view="une">À la une</button>
        <button class="vtab" role="tab" data-view="briefing">Briefing</button>
        <button class="vtab" role="tab" data-view="actu">Toute l'actu</button>
        <button class="vtab" role="tab" data-view="sources">Sources</button>
      </div>
      <input class="vsearch" id="q" type="search" placeholder="Rechercher dans la veille" aria-label="Rechercher">
    </div>
  </nav>

  <main class="wrap" id="contenu">
    <section class="view" id="v-une">
      <div class="dateline"><span id="date"></span><span class="upd" id="upd"></span><button class="go" id="gob" type="button">▶ Briefing du jour</button></div>
      <div class="front">
        <div class="maincol"><a id="lead" class="lead"></a><div class="minis" id="minis"></div></div>
        <aside class="side"><div class="pv" id="pouls"></div><div class="brief" id="brief"></div><div class="topics" id="topics"></div></aside>
      </div>
      <div class="sections" id="sections"></div>
    </section>

    <section class="view" id="v-actu" hidden>
      <div class="filters">
        <nav class="tabs" id="tabs" aria-label="Sujets"></nav>
        <select id="fsrc" aria-label="Source"></select>
        <select id="fper" aria-label="Période"><option value="all">Toute la période</option><option value="1">24 h</option><option value="7">7 jours</option><option value="30">30 jours</option></select>
        <select id="flang" aria-label="Langue"><option value="all">Toutes les langues</option><option value="fr">Français uniquement</option><option value="en">Anglais uniquement</option></select>
        <span class="dayf"><input type="date" id="fday" aria-label="Jour précis"><button type="button" id="fday-x" hidden aria-label="Effacer le jour">×</button></span>
        <span class="count" id="count" aria-live="polite"></span>
      </div>
      <div class="mosaic" id="grid"></div>
      <div class="more"><button id="more" type="button">Voir plus d'articles</button></div>
    </section>

    <section class="view" id="v-sources" hidden>
      <div class="shead"><h2>Choisissez votre source</h2><p>Le nombre d'articles retenus et le dernier titre. Un clic ouvre tous ses articles.</p></div>
      <div class="tiles" id="tiles"></div>
    </section>
  </main>

  <section class="view bview" id="v-briefing" hidden>
    <div class="stage" id="b-stage">
      <div class="giant" id="b-giant" aria-hidden="true"></div>
      <div class="wrap slide" id="b-slide" aria-live="polite"></div>
      <nav class="wrap bnav" aria-label="Navigation du briefing">
        <div class="segs" id="b-segs"></div>
        <span class="keys">← → pour naviguer</span>
        <div class="btns"><button id="b-prev" type="button" aria-label="Précédent">←</button><button id="b-next" type="button" aria-label="Suivant">→</button></div>
      </nav>
    </div>
  </section>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <a href="https://hoplite-cyber.com" target="_blank" rel="noopener" aria-label="Hoplite Cybersécurité"><img class="footer-logo" src="assets/brand/logo-horizontal-blanc.png" alt="Hoplite Cybersécurité" width="120" height="40"></a>
      <p>Articles collectés automatiquement depuis des sources publiques. Chaque titre renvoie vers la source d'origine.</p>
    </div>
  </footer>

  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="panel" aria-label="Articles de la source"></aside>

  <script src="anim.js"></script>
  <script src="app.js"></script>
</body>
</html>
